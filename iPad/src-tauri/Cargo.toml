[package]
name = "nectar-ipad"
version = "0.1.0"
description = "Nectar for iPad: a Tauri shell around the server's own web client"
authors = ["Ocelli <nate@bierlysmith.com>"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2"
tokio = { version = "1", features = ["time", "sync", "macros"] }

# Telling an iPhone from an iPad, and the system sign-in sheet (#144).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSError", "NSArray", "NSUserActivity"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVCaptureInput", "AVCaptureSession", "AVCaptureOutputBase", "AVCaptureMetadataOutput", "AVCaptureVideoPreviewLayer", "AVMediaFormat", "AVMetadataObject", "AVAnimation", "dispatch2", "objc2-quartz-core", "block2"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
dispatch2 = "0.3"
objc2-ui-kit = { version = "0.3", features = ["UIDevice", "UIView", "UIViewController", "UIWindow", "UIResponder", "UIActivityViewController", "UIPopoverPresentationController", "UIPresentationController", "UISheetPresentationController", "objc2-core-foundation", "UIButton", "UIControl", "UILabel", "UIColor", "UIFeedbackGenerator", "UIImpactFeedbackGenerator", "UIGeometry", "NSText", "objc2-quartz-core"] }
objc2-authentication-services = { version = "0.3", features = ["ASWebAuthenticationSession", "ASFoundation", "block2"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
