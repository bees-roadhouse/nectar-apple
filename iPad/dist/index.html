<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nectar</title>
<style>
  /* The launch screen only; the web client brings its own look once signed in. The tokens and values are the
     Brand & Visual Identity Standard's (KB page 2451): charcoal and gold, dark only. */
  :root {
    --brh-bg: #111214;
    --brh-card: #1d2024;
    --brh-line-dim: #2a2d32;
    --brh-gold: #e8a03a;
    --brh-gold-hi: #f4b660;
    --brh-gold-ink: #1a1407;
    --brh-text: #f2f3f5;
    --brh-text2: #c4c8ce;
    --brh-err: #e06b52;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--brh-bg); color: var(--brh-text);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  main { width: min(520px, 100%); }
  h1 { font-size: 34px; margin: 0 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 18px; color: var(--brh-text2); }
  label { display: block; font-size: 15px; color: var(--brh-text2); margin-bottom: 8px; }
  input {
    width: 100%; font: inherit; color: var(--brh-text); background: var(--brh-card);
    border: 1px solid var(--brh-line-dim); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
  }
  button {
    font: inherit; font-weight: 600; color: var(--brh-gold-ink); background: var(--brh-gold);
    border: 0; border-radius: 12px; padding: 14px 22px; min-height: 48px;
  }
  button:active { background: var(--brh-gold-hi); }
  button[disabled] { opacity: 0.5; }
  .code { font: 600 48px/1.1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; margin: 8px 0 16px; }
  .qr { background: #fff; border-radius: 12px; padding: 12px; width: fit-content; margin-bottom: 16px; }
  .qr svg { display: block; width: 240px; height: 240px; }
  .error { color: var(--brh-err); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <section id="ask">
    <h1>Nectar</h1>
    <p>Sign in to your server. You'll approve this iPad from a phone or computer that's already signed in.</p>
    <form id="form">
      <label for="server">Server</label>
      <input id="server" name="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="nectar.example.com" required>
      <button id="go" type="submit">Get a code</button>
    </form>
  </section>
  <section id="wait" hidden>
    <h1>Approve this iPad</h1>
    <p>On a signed-in phone or computer, go to <strong id="where"></strong> and enter:</p>
    <div class="code" id="code"></div>
    <div class="qr" id="qr"></div>
    <p>Or scan the code with a phone's camera. This waits until it's approved.</p>
  </section>
  <p class="error" id="error" role="alert" hidden></p>
</main>
<script>
  const { invoke } = window.__TAURI__.core;
  const $ = (id) => document.getElementById(id);
  const fail = (message) => {
    $("error").textContent = String(message);
    $("error").hidden = false;
    $("ask").hidden = false;
    $("wait").hidden = true;
    $("go").disabled = false;
  };

  $("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    $("error").hidden = true;
    $("go").disabled = true;
    try {
      const code = await invoke("begin_sign_in", { server: $("server").value });
      $("where").textContent = code.verification_uri.replace(/^https?:\/\//, "");
      $("code").textContent = code.user_code;
      $("qr").innerHTML = code.qr_svg;
      $("ask").hidden = true;
      $("wait").hidden = false;
      // On approval the shell navigates this window to the server, so success never returns here.
      await invoke("finish_sign_in");
    } catch (message) {
      fail(message);
    }
  });
</script>
</body>
</html>
